name: Node.js build

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
            - run: npm test
            # Reported, not yet blocking. Everything left is in
            # embeddable-markdown-editor.ts, which reaches into Obsidian's
            # non-public editor API and therefore cannot be typed without
            # inventing a contract Obsidian never gave. Once that is settled,
            # drop continue-on-error so new findings fail the build - which is
            # the point: these accumulated for months because nothing ran.
            - run: npm run lint
              continue-on-error: true
